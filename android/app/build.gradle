plugins { id 'com.android.application' }

android {
  namespace 'dz.fahes.app'
  compileSdk 34

  defaultConfig {
    applicationId "dz.fahes.app"
    minSdk 24
    targetSdk 34
    versionCode 2
    versionName "1.1"
  }

  signingConfigs {
    release {
      storeFile file(System.getenv("FAHES_KEYSTORE") ?: "fahes-release.jks")
      storePassword System.getenv("FAHES_STORE_PASS")
      keyAlias System.getenv("FAHES_KEY_ALIAS") ?: "fahes"
      keyPassword System.getenv("FAHES_KEY_PASS")
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

configurations.all {
  resolutionStrategy {
    force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
