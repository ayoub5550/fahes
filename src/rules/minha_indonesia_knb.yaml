# منحة إندونيسيا KNB — وزارة التعليم العالي والعلوم والتكنولوجيا الإندونيسية بالتعاون مع السفارة الإندونيسية بالجزائر. المصدر: https://knb.kemdiktisaintek.go.id/
cond:
  valeur: oui

