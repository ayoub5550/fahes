  question: هل تلتزم بآجال إنجاز المشروع المصرَّح بها؟

cond . societe:
  titre: كيان قانوني مسجّل
  description: الامتيازات تُمنح لمشروع استثماري باسم شخص طبيعي أو معنوي مسجّل قانوناً.
  valeur: societe = oui
cond . liste:
  titre: النشاط غير مستثنى
  description: راجع قائمة النشاطات المستثناة قبل الإيداع، فبعض النشاطات التجارية البحتة لا تستفيد.
  valeur: liste negative = oui
cond . enregistrement:
  titre: تسجيل المشروع على المنصة الرقمية للمستثمر
  description: التسجيل عبر المنصة أو الشباك الوحيد هو نقطة الانطلاق الرسمية لملف الامتيازات.
  valeur: enregistrement = oui
cond . delai:
  titre: الالتزام بآجال الإنجاز
  description: عدم احترام آجال الإنجاز المصرَّح بها يؤدي إلى سحب الامتيازات واسترجاع ما استُفيد منه.
  valeur: delai = oui
