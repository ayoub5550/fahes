# امتيازات الاستثمار — الوكالة الجزائرية لترقية الاستثمار (AAPI)، قانون الاستثمار 22-18.
cond:
  valeur: oui

societe:
  question: هل لديك شركة مسجّلة في الجزائر (سجل تجاري ورقم جبائي)؟
projet:
  question: طبيعة المشروع
  une possibilité:
    - creation
    - extension
    - rehabilitation
projet . creation:
  titre: إنشاء نشاط جديد
projet . extension:
  titre: توسيع قدرات إنتاج قائمة
projet . rehabilitation:
  titre: إعادة تأهيل
liste negative:
  question: هل نشاطك خارج قائمة النشاطات المستثناة من الامتيازات؟
enregistrement:
  question: هل سجّلت المشروع على المنصة الرقمية للمستثمر أو لدى الشباك الوحيد؟
