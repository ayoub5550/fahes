# المنح الحكومية السويسرية الفدرالية للتميز — الأمانة الدولة السويسرية للتعليم والبحث والابتكار SERI/SBFI عبر اللجنة الفدرالية FCS (ESKAS). المصدر: https://www.sbfi.admin.ch/en/swiss-government-excellence-scholarships
cond:
  valeur: oui

age:
