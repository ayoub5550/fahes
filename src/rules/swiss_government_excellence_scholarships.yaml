cond . research_duration:
  titre: "مدة البحث"
  description: "مدة المنحة بين 6 و12 شهرًا دون إمكانية التمديد للفئة [المصدر: https://www.sbfi.admin.ch/en/swiss-government-excellence-scholarships-at-a-glance]"
