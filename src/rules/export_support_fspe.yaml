# الصندوق الخاص لترقية الصادرات (FSPE) — وزارة التجارة الخارجية وترقية الصادرات (MCEPE) / الوكالة الوطنية لترقية التجارة الخارجية (ALGEX). المصدر: https://commerce.gov.dz/a-fonds-special-pour-la-promotion-des-exportations-fspe
cond:
  valeur: oui

registre commerce:
  question: "هل تمتلك سجلاً تجارياً نشطاً في نشاط التصدير؟"
montant depense:
  question: "ما هو مبلغ النفقات المؤهلة لترقية الصادرات؟"
  unité: DA
annees experience:
  question: "كم عدد سنوات خبرتك كمُصدِّر؟"
  unité: an
participation feire:
