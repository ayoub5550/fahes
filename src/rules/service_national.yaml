motif . exemption age:
  titre: إعفاء بحكم السن (مواليد ما قبل 1995)
motif . exemption medicale:
  titre: إعفاء لسبب طبي
motif . exemption sociale:
  titre: إعفاء لسبب اجتماعي (ابن وحيد، وفاة الوالدين، عائلة كثيرة العدد)
