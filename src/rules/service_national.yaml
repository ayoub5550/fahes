  question: هل أنت مسجّل حالياً في مؤسسة تعليم أو تكوين؟

cond . age:
  titre: الإعفاء بالسن للمولودين قبل 1995
  description: المرسوم الرئاسي 24-184 أعفى المواطنين المولودين قبل 01 جانفي 1995 ولم يُجنَّدوا بعد.
  une de ces conditions:
    - motif != 'exemption age'
    - toutes ces conditions:
        - annee naissance < 1995 an
        - statut != 'accompli'
cond . justificatif:
  titre: وثائق تبرير الإعفاء
  description: الشهادات الطبية يجب أن تكون من القطاع العمومي.
  une de ces conditions:
    - motif = 'attestation'
    - motif = 'exemption age'
    - justificatif = oui
cond . etudes:
  titre: إثبات التمدرس لطلب التأجيل
  description: التأجيل مرتبط بمتابعة دراسة أو تكوين ساري.
  une de ces conditions:
    - motif != 'report etudes'
    - inscrit universite = oui
