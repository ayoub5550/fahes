# الخدمة الوطنية: الإعفاء والتأجيل — الأمر 14-06 والمرسوم الرئاسي 24-184.
cond:
  valeur: oui

annee naissance:
  question: سنة ميلادك
  unité: an
statut:
  question: وضعيتك الحالية
  une possibilité:
    - non recense
    - recense
    - accompli
    - insoumis
statut . non recense:
  titre: لم أُحصَ بعد
statut . recense:
  titre: محصى ولم أُجنَّد
