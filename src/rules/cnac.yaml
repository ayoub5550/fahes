cond . age:
  titre: السن بين 30 و50 سنة
  description: خارج شريحة CNAC. تحت 35 سنة توجّه إلى ANADE، وبلا رأس مال إلى ANGEM.
  toutes ces conditions:
    - age >= 30 an
    - age <= 50 an
cond . nationalite:
  titre: الجنسية الجزائرية
  description: الجنسية الجزائرية شرط أساسي.
