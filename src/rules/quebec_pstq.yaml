# برنامج اختيار العمال المهرة في كيبيك (PSTQ) — Ministère de l'Immigration, de la Francisation et de l'Intégration (MIFI), Québec. المصدر: https://www.quebec.ca/immigration/permanente/travailleurs-qualifies/programme-selection-travailleurs-qualifies/exigences
cond:
  valeur: oui

age:
  question: "ما هو عمرك بالسنوات؟"
  unité: an
maitrise francais:
  question: "هل تمتلك مستوى معتمد في اللغة الفرنسية؟"
engagement financier:
  question: "هل توافق على توقيع عقد الاكتفاء الذاتي المالي؟"
