# القرض الاستهلاكي للمنتجات المصنَّعة محلياً — مرسوم تنفيذي 15-114.
cond:
  valeur: oui
montant:
  valeur: oui

produit local:
  question: هل السلعة مصنَّعة أو مركَّبة في الجزائر؟
revenu:
  question: دخلك الشهري الصافي
  unité: DA
anciennete:
  question: أقدميتك في العمل أو النشاط
  unité: an
autres credits:
  question: مجموع أقساطك الشهرية الحالية
  unité: DA
prix:
  question: ثمن السلعة
  unité: DA
duree:
  question: مدة التسديد المطلوبة
  unité: an
