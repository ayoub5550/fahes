cond . formation:
  titre: "مدة التدريب"
  description: "ألا تقل مدة التدريب المهني الأصلية عن سنتين."
  valeur: annees formation >= 2 an
cond . reconnaissance:
  titre: "الاعتراف بالمؤهل"
  description: "الاعتراف الكامل بالمؤهل المهني الأجنبي كمعادل للتأهيل الألماني."
  valeur: reconnaissance diplome = oui
cond . allemand:
  titre: "اللغة الألمانية"
  description: "الحصول على مستوى لغة ألمانية B1 على الأقل."
  valeur: niveau allemand = oui
cond . contrat:
  titre: "عقد العمل"
  description: "وجود عرض عمل أو عقد عمل فعلي مرتبط بالمؤهل المحصَّل عليه."
  valeur: offre emploi = oui
cond . subsistance:
  titre: "مصدر العيش"
  description: "تأمين مصدر العيش (Lebensunterhalt) طوال مدة الإقامة."
  valeur: assurance subsistance = oui
