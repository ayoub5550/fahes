# تأشيرة العامل المؤهل الألمانية (قانون هجرة الكفاءات) — مكتب الهجرة واللاجئين الألماني (BAMF). المصدر: https://www.bamf.de/EN/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/Arbeit/Fachkraft/fachkraft-node.html
cond:
  valeur: oui

annees formation:
  question: "ما عدد سنوات التدريب المهني الأصلية؟"
  unité: an
reconnaissance diplome:
  question: "هل تم الاعتراف الكامل بالمؤهل المهني الأجنبي؟"
niveau allemand:
  question: "هل لديك مستوى لغة ألمانية B1 على الأقل؟"
offre emploi:
  question: "هل لديك عرض عمل أو عقد عمل فعلي؟"
