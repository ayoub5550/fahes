# برنامج زمالة مؤسسة ماستركارد — مؤسسة Mastercard Foundation بالشراكة مع جامعات عالمية. المصدر: https://edinburgh-global.ed.ac.uk/mastercard-foundation-scholars-program/apply-for-a-scholarship/eligibility
cond:
  valeur: oui

age:
  question: "ما هو عمرك الحالي بالسنوات؟"
  unité: an
nationalite africaine:
  question: "هل تحمل جنسية وتقيم في دولة أفريقية (مثل الجزائر)؟"
double nationalite:
  question: "هل لديك جنسية مزدوجة مع دولة خارج أفريقيا (مثل أمريكا، كندا، بريطانيا، أو أوروبا)؟"
besoin financier:
  question: "هل يمكنك إثبات الحاجة المالية الحقيقية للتمويل؟"
master precedent:
  question: "هل لديك شهادة ماجستير مسبقة؟"

cond . age_limite:
  titre: "السن الأقصى"
  description: "الحد الأقصى للسن 35 سنة عند بدء البرنامج (يُقبل من وُلد في 1 يناير 1991 أو بعده لدورة 2026/2027) [المصدر: https://edinburgh-global.ed.ac.uk/mastercard-foundation-scholars-program/apply-for-a-scholarship/eligibility]"
  valeur: age <= 35 an
cond . afrique:
  titre: "الجنسية والإقامة الأفريقية"
  description: "أن يكون المتقدم مواطنًا ومقيمًا في دولة أفريقية، والجزائر مدرجة صراحة ضمن قائمة الدول المؤهلة [المصدر: https://www.mcgill.ca/mastercardfdn-scholars/apply/eligibility]"
  valeur: nationalite africaine = oui
cond . no_double:
  titre: "عدم ازدواج الجنسية"
  description: "حاملو جنسية مزدوجة مع دولة خارج أفريقيا مع إقامة/جنسية أمريكية أو كندية أو بريطانية أو أوروبية غير مؤهلين [المصدر: https://mcfscholarsprogram.berkeley.edu/am-i-eligible-scholarship]"
  valeur: double nationalite = non
cond . besoin:
  titre: "إثبات الحاجة المالية"
  description: "إثبات حاجة مالية حقيقية للتمويل عبر وثائق داعمة [المصدر: https://www.sciencespo.fr/students/en/fees-funding/bursaries-financial-aid/mastercard-foundation-scholarships/graduate-study/]"
  valeur: besoin financier = oui
cond . no_master:
  titre: "عدم حيازة ماجستير مسبق"
  description: "عدم حيازة شهادة ماجستير مسبقًا للمتقدمين لمنحة الماجستير [المصدر: https://www.sciencespo.fr/students/en/fees-funding/bursaries-financial-aid/mastercard-foundation-scholarships/graduate-study/]"
  valeur: master precedent = non
