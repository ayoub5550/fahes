# منحة "ستيبنديوم هنغاريكوم" المجرية — Tempus Public Foundation (المجر). المصدر: https://stipendiumhungaricum.hu/apply/
cond:
  valeur: oui

nationalite algerienne:
  question: "هل أنت مواطن جزائري؟"
score admission:
  question: "ما هي نقطة اختبار القبول لديك؟"
  unité: point
double depot:
  question: "هل قمت بتقديم الملف عبر النظام الإلكتروني والجهة الوطنية معاً؟"
nombre programmes:
  question: "كم عدد البرامج الدراسية المختارة؟"
