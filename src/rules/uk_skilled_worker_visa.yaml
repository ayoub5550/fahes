# تأشيرة العامل المؤهل البريطانية — Home Office (المملكة المتحدة) / GOV.UK. المصدر: https://www.gov.uk/skilled-worker-visa/your-job
cond:
  valeur: oui

salary:
  question: "ما هو راتبك السنوي؟"
  unité: EUR
