# المنحة الجامعية — منصة E-minha (PROGRES).
cond:
  valeur: oui

snmg:
  valeur: 24000 DA
inscrit:
  question: هل أنت مسجّل بصفة نظامية في مؤسسة جامعية عمومية؟
ccp:
  question: هل الحساب البريدي الجاري (CCP) مفتوح باسمك أنت حصراً؟
progres:
  question: هل تملك حساب PROGRES نشطاً (رقم البكالوريا وكلمة السر)؟
revenu parents:
  question: الدخل الشهري الإجمالي للأولياء
  unité: DA
redoublant:
