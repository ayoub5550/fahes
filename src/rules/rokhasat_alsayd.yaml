# رخصة الصيد البري (حمل السلاح لممارسة الصيد) — المحافظة السامية للغابات ومحافظات الغابات بالولايات – وزارة الفلاحة والتنمية الريفية. المصدر: https://leap.unep.org/en/countries/dz/national-legislation/decret-executif-n-06-387-fixant-les-conditions-et-les-modalites-dobtention-et-de-delivrance-de-la-licence-de-chasser-lex-faoc078795
cond:
  valeur: oui

age:
  question: "كم عمرك؟"
