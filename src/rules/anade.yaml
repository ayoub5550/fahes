# ANADE — إنشاء مؤسسة مصغرة (التمويل الثلاثي).
cond:
  valeur: oui
montant:
  valeur: oui

age:
  question: سنّك
  unité: an
trois emplois:
  question: هل سيوفّر المشروع 3 مناصب شغل دائمة على الأقل؟
qualification:
  question: هل لديك شهادة أو مؤهل مهني أو خبرة مثبتة في مجال المشروع؟
emploi salarie:
  question: هل تشغل منصب عمل مأجوراً حالياً؟
inscrit anem:
  question: هل أنت مسجّل كطالب عمل لدى ANEM؟
en formation:
  question: هل أنت مسجّل في جامعة أو مركز تكوين حالياً؟
aide anterieure:
  question: هل استفدت من جهاز دعم لإنشاء نشاط من قبل؟
