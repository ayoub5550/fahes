# تخصيص حصة من الصفقات العمومية للمؤسسات المصغرة والناشئة — وزارة المالية (تنظيم الصفقات العمومية). المصدر: https://www.mf.gov.dz/index.php/ar/activites-ar/1212-2023-08-13-15-52-56
cond:
